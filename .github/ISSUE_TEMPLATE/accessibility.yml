name: Accessibility report
description: Report a keyboard, screen-reader, contrast, motion, zoom, or other accessibility barrier.
title: "[Accessibility]: "
labels: [accessibility, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thank you for helping make Randomander usable. Do not include localStorage dumps or personal data.
  - type: input
    id: environment
    attributes:
      label: Browser, OS, viewport, and zoom
      placeholder: Firefox 128, Windows 11, 1280 × 720, 200%
    validations:
      required: true
  - type: input
    id: assistive_technology
    attributes:
      label: Assistive technology or input method
      placeholder: NVDA 2026.1, keyboard only, voice control, switch input
  - type: dropdown
    id: barrier
    attributes:
      label: Barrier type
      options:
        - Keyboard or focus
        - Screen reader or semantics
        - Contrast or color
        - Zoom, reflow, or text spacing
        - Motion or animation
        - Touch target or pointer
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and affected content
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact and expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, identifiers, and browser-storage content.
          required: true
